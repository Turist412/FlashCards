<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-8">
  <div class="w-full max-w-md">
    <div class="rounded-2xl bg-white p-6 shadow-sm sm:p-8">
      <header class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-gray-900">Вход</h1>
        <p class="mt-2 text-sm text-gray-500">Войдите, чтобы продолжить обучение</p>
      </header>

      <form
        class="space-y-5"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        novalidate
      >
        @if (errorMessage(); as message) {
          <p
            class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
            role="alert"
          >
            {{ message }}
          </p>
        }

        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="example@mail.com"
            class="w-full rounded-2xl border border-gray-200 bg-gray-50 p-4 text-base text-gray-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 disabled:opacity-50"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <p class="text-sm text-red-600">Введите корректный email</p>
          }
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-gray-700">
            Пароль
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Введите пароль"
            class="w-full rounded-2xl border border-gray-200 bg-gray-50 p-4 text-base text-gray-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 disabled:opacity-50"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <p class="text-sm text-red-600">Введите пароль</p>
          }
        </div>

        <button
          type="submit"
          class="w-full rounded-2xl bg-blue-600 p-4 text-base font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="isSubmitting()"
        >
          {{ isSubmitting() ? 'Загрузка...' : 'Войти' }}
        </button>
      </form>
    </div>
  </div>
</div>
