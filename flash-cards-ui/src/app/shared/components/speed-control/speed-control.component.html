<div class="speed-control-wrapper">
      <span class="icon turtle" title="Медленнее">🐢</span>
      
      <input 
        type="range" 
        min="0.5" 
        max="1.5" 
        step="0.1"
        [ngModel]="ttsService.rate" 
        (ngModelChange)="updateRate($event)"
        class="slider"
      >
      
      <span class="icon rabbit" title="Быстрее">🐇</span>
      <span class="value">{{ ttsService.rate | number:'1.1-1' }}x</span>
    </div>
