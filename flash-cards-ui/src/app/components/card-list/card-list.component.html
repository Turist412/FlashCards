<div class="container">

  <div class="header-actions">
      <div class="header-left">
          <a routerLink="/" class="back-btn">← Назад</a>
          <h2>Слова в колоде</h2>

          <button class="start-btn" (click)="openStudySettings()" *ngIf="cards.length > 0">
             Тренировка
          </button>
      </div>

      <button class="add-btn" (click)="openCreateModal()">+ Добавить слово</button>
  </div>

  <hr>

  <div class="cards-grid">
    <div class="flip-card" *ngFor="let card of cards" (click)="toggleFlip(card.id)">
      
      <div class="flip-card-inner" [class.flipped]="isFlipped(card.id)">

        <div class="flip-card-front" [ngClass]="getGenderClass(card)">
            <div class="card-content">
                <h2 class="main-text">{{ card.frontText }}</h2>
                
                <p *ngIf="card.language === eLanguage.German && card.plural" class="sub-text">
                    (pl. {{ card.plural }})
                </p>

                <p *ngIf="card.language === eLanguage.Japanese && card.pronunciation" class="sub-text">
                    [{{ card.pronunciation }}]
                </p>
            </div>

            <div class="card-actions">
                <button (click)="startEdit(card, $event)" class="icon-btn">✏️</button>
                <button (click)="deleteCard(card.id, $event)" class="icon-btn">🗑</button>
            </div>
        </div>

        <div class="flip-card-back" [ngClass]="getGenderClass(card)">
            <div class="card-content">
                <h2 class="main-text">{{ card.backText }}</h2>
            </div>

            <div class="card-actions">
                <button (click)="startEdit(card, $event)" class="icon-btn">✏️</button>
                <button (click)="deleteCard(card.id, $event)" class="icon-btn">🗑</button>
            </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
    
    <div class="modal-window" (click)="$event.stopPropagation()">
        
        <div class="modal-header">
            <h3>{{ editingCardId ? 'Редактирование' : 'Новое слово' }}</h3>
            <span class="close-icon" (click)="closeModal()">&times;</span>
        </div>

        <div class="modal-body">
            <label>Язык карточки:</label>
            <select [(ngModel)]="currentCard.language">
                <option [ngValue]="eLanguage.German">German</option>
                <option [ngValue]="eLanguage.Japanese">Japanese</option>
            </select>

            <input [(ngModel)]="currentCard.frontText" placeholder="Слово / Фраза (Front)">
            <input [(ngModel)]="currentCard.backText" placeholder="Перевод (Back)">

            <div *ngIf="currentCard.language === eLanguage.German" class="lang-specific">
                <label>Грамматический род:</label>
                <select [(ngModel)]="currentCard.gender">
                    <option [ngValue]="eGender.None">Не указан</option>
                    <option [ngValue]="eGender.Masculine">Мужской (Der)</option>
                    <option [ngValue]="eGender.Feminine">Женский (Die)</option>
                    <option [ngValue]="eGender.Neuter">Средний (Das)</option>
                </select>

                <input [(ngModel)]="currentCard.plural" placeholder="Множественное число (Plural)">
            </div>

            <div *ngIf="currentCard.language === eLanguage.Japanese" class="lang-specific">
                <input [(ngModel)]="currentCard.pronunciation" placeholder="Чтение (Kana/Romaji)">
            </div>
        </div>

        <div class="modal-footer">
            <button (click)="closeModal()" class="cancel-btn">Отмена</button>
            <button (click)="saveCard()" class="save-btn">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" *ngIf="showStudyModal" (click)="closeStudySettings()">
    <div class="modal-window" (click)="$event.stopPropagation()">
        
        <div class="modal-header">
            <h3>Настройки тренировки</h3>
            <span class="close-icon" (click)="closeStudySettings()">×</span>
        </div>

        <div class="modal-body">
            <label>Выберите режим:</label>
            <select [(ngModel)]="selectedType" style="margin-top: 10px; width: 100%; padding: 10px;">
                <option [ngValue]="eQuestionType.MultipleChoice">Тест (1 из 4)</option>
                <option [ngValue]="eQuestionType.TrueFalse">Правда / Ложь</option>
                <option [ngValue]="eQuestionType.FillInTheBlank">Вписать слово</option>
            </select>

            <div style="margin-top: 20px; padding: 10px; background: #e3f2fd; border-radius: 5px; font-size: 0.9em;">
                <p style="margin: 0;">В этом режиме вы просто тренируетесь. Результаты не влияют на расписание повторений.</p>
            </div>
        </div>

        <div class="modal-footer">
            <button class="cancel-btn" (click)="closeStudySettings()">Отмена</button>
            <button class="save-btn" (click)="startPractice()" style="background-color: #673ab7;">Поехали!</button>
        </div>
    </div>
</div>
