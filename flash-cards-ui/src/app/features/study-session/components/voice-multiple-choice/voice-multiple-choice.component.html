<div class="mc-container">
    <div class="audio-section">
        <button 
            class="huge-speak-btn" 
            (click)="playAudio($event)" 
            [disabled]="isAnswerProcessed"
            title="Прослушать еще раз">
            🔊
        </button>

        <div style="margin-top: 10px; display: flex; justify-content: center;">
             <app-speed-control></app-speed-control>
        </div>
        
        <p class="hint">Послушайте и выберите правильный перевод</p>
    </div>

    <div class="options-grid">
      <button *ngFor="let option of card.possibleAnswers"
              class="option-btn"
              [class.correct]="isAnswerProcessed && isCorrectOption(option)"
              [class.wrong]="isAnswerProcessed && selectedOption === option && !isCorrectOption(option)"
              [disabled]="isAnswerProcessed"
              (click)="onOptionClick(option)">
        {{ option }}
      </button>
    </div>
</div>
