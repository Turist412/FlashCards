<div class="tf-container">
  
  <div class="comparison-block">
    <h2 class="question">{{ questionText }}</h2>
    
    <div class="connector">
      <span class="arrow">⬇️</span>
    </div>

    <h2 class="proposed-word">{{ card.displayedBackText }}</h2>
  </div>

  <p class="hint">Верно ли это утверждение?</p>

  <div class="options-grid">
    
    <button class="option-btn"
            [class.correct]="isAnswerProcessed && userChoice === false && wasLastAnswerCorrect"
            [class.wrong]="isAnswerProcessed && userChoice === false && !wasLastAnswerCorrect"
            [class.faded]="isAnswerProcessed && userChoice !== false"
            [disabled]="isAnswerProcessed"
            (click)="onChoice(false)">
      ❌ НЕТ
    </button>

    <button class="option-btn"
            [class.correct]="isAnswerProcessed && userChoice === true && wasLastAnswerCorrect"
            [class.wrong]="isAnswerProcessed && userChoice === true && !wasLastAnswerCorrect"
            [class.faded]="isAnswerProcessed && userChoice !== true"
            [disabled]="isAnswerProcessed"
            (click)="onChoice(true)">
      ✅ ДА
    </button>
  </div>

  <div *ngIf="isAnswerProcessed" 
       class="result-message" 
       [class.success]="wasLastAnswerCorrect" 
       [class.error]="!wasLastAnswerCorrect">
      {{ wasLastAnswerCorrect ? 'Правильно!' : 'Ошибка!' }}
  </div>

</div>
